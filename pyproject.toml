[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doql-mcp"
version = "0.1.0"
description = "MCP server exposing Device42 DOQL queries and data dictionary schemas"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.scripts]
doql-mcp = "doql_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doql_mcp = ["skills/*/SKILL.md"]
